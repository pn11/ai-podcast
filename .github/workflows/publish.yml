name: publish

# 既定ブランチに push されたら（github-pages 環境は既定ブランチからのデプロイしか受け付けないため）: 新規・変更エピソードだけ VOICEVOX で音声合成 → Releases に MP3 を添付
# → feed.xml / HTML を生成して GitHub Pages へ直接デプロイ（Settings → Pages の Source は "GitHub Actions"）
on:
  push:
  workflow_dispatch:
    inputs:
      force:
        description: "全エピソードの音声を作り直す"
        type: boolean
        default: false

permissions:
  contents: write   # Releases の作成
  pages: write      # Pages へのデプロイ
  id-token: write   # deploy-pages の OIDC 認証

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-0.26.0
        ports: ["50021:50021"]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: uv sync --locked
      - name: Privacy / consistency check
        run: uv run aipodcast check

      - name: Fetch metadata of already-published audio
        run: |
          mkdir -p build/existing
          for tag in $(gh release list --limit 1000 --json tagName -q '.[].tagName' | grep '^ep-' || true); do
            gh release download "$tag" --pattern '*.json' --dir build/existing --clobber || true
          done
          ls -la build/existing

      - name: Synthesize new or changed episodes
        run: uv run aipodcast audio --existing build/existing ${{ inputs.force && '--force' || '' }}

      - name: Upload MP3 to Releases
        run: |
          while read -r code; do
            [ -n "$code" ] || continue
            tag="ep-$code"
            gh release view "$tag" >/dev/null 2>&1 || \
              gh release create "$tag" --target "$GITHUB_SHA" --title "Episode $code" --latest=false \
                --notes "Audio for episode $code. See https://pn11.github.io/ai-podcast/episodes/$code/"
            gh release upload "$tag" "build/audio/$code.mp3" "build/audio/$code.json" --clobber
          done < build/audio/new.txt

      - name: Build site and feed
        run: uv run aipodcast site --audio build/audio --out build/site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
      - id: deploy
        uses: actions/deploy-pages@v4
