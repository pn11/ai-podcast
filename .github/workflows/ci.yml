name: ci

# PR 用。Secret は使わない（フォークからの PR でも安全に動く）
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install ffmpeg
        timeout-minutes: 15
        run: |
          # apt ミラーが詰まって止まることがあるので、1 回あたりの時間を区切って再試行する
          for i in 1 2 3; do
            timeout 240 sudo apt-get update -q && \
              timeout 240 sudo apt-get install -y -q --no-install-recommends ffmpeg && exit 0
            echo "apt attempt $i failed, retrying"; sleep $((i * 10))
          done
          exit 1
      - run: uv sync --locked
      - run: uv run aipodcast check
      - run: uv run pytest -q
