title: SuperMimic ― 人型ロボットの全身制御を「GPU 1台・数時間」で
summary: >-
  CoRL 2026 で口頭発表に選ばれた UC Berkeley の SuperMimic を解説します。人型ロボットに人の全身の動きをまねさせる学習を、
  シミュレーターのデータから学んだ「一つの微分できるワールドモデル」を全動作で共有することで、GPU 時間を千分の一以下に。
  12万9千あまりの動作のベンチマークで失敗25件（比較相手179件）、Unitree G1 の実機へも移行。ベストペーパーとする紹介記事もありますが公式発表は未確認です。
published_at: 2026-11-13T19:00:00+09:00
