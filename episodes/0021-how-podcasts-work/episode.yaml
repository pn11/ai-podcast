title: ポッドキャストの裏側 ― RSS、エンクロージャー、チャプターの仕組み
summary: >-
  この番組がどうやってアプリに届いているのか、ポッドキャストの仕組みと歴史を紹介します。
  RSS とエンクロージャー、2004年の「ポッドキャスト」という言葉と2005年のアップルの対応、エピソードを見分ける GUID とファイルの大きさ、
  チャプターの二つの入れ方（MP3 の ID3 チャプターと Podcasting 2.0 の chapters.json）、文字起こし、音声ファイルのメタデータとプライバシー。
