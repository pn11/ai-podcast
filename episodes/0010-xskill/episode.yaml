title: XSkill ― 人の動画からロボットのスキルを見つけ出す
summary: >-
  Shuran Song らのグループ（当時コロンビア大学）による CoRL 2023 の論文 XSkill を紹介します。
  ラベルのない人とロボットの動画から、体を超えて共有できる「スキル・プロトタイプ」を見つけ（時間の対照学習と Sinkhorn-Knopp）、
  スキルを条件にしたディフュージョン・ポリシーでロボットの動きに移し、人のお手本動画から新しいタスクを組み立てる（Skill Alignment Transformer で速さの違いを吸収）。
  限界と後続研究、これまでの回とのつながりも。論文の概要・プロジェクトページ・後続研究の紹介をもとにしており、細かい数字は論文で確認してください。
published_at: 2026-11-08T12:00:00+09:00
