title: ロボットにワールドモデルは必要か ― アトラスと最終日の討論
summary: >-
  CoRL 2026 で最もよく聞いた言葉「ワールドモデル」を、二つの出来事から整理します。
  Fei-Fei Li の基調講演で紹介された World Labs の Atlas（文章・画像・動画・3D で学習した自己回帰型のワールドモデル、生成と 3D 復元を統一）と、
  AMD による World Labs 買収（約82億ドル）とリサ・スーとの対談。最終日の討論型ワークショップ「Do Robots Need World Models?」の形式と登壇者、
  明示派・暗黙派・組み合わせ派の争点。講演・討論の中身と投票結果は未確認です。
