title: テスラってどんな会社？ ― 電気自動車からロボタクシー、人型ロボットまで
summary: >-
  ロボタクシーの回で何度も出てきたテスラを紹介します。本社はテキサス州オースティン（2021年にパロアルトから移転）、
  社名の由来、2003年の創業とイーロン・マスクの参加、ロードスターからサイバートラックまでの戦略、カメラ中心の自動運転とロボタクシー、
  人型ロボット「オプティマス」の2026年の状況（生産数などは報道で食い違いあり）、ロボット研究の視点からの見どころ。
