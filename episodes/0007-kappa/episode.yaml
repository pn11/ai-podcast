title: フライスのカッパってなに？ ― 判定の「一致」を測る
summary: >-
  第1回で出てきた「フライスのカッパ 0.78 と 0.33」を入り口に、判定のそろい具合を測る指標を解説します。
  一致率の落とし穴（偶然の一致）、コーエンのカッパの考え方と計算例、データが偏ったときのカッパのパラドックス、
  3人以上で使えるフライスのカッパ、数字の読み方（Landis & Koch の目安）、重み付きカッパとクリッペンドルフのアルファ、
  ロボット研究（ラベル付け・成功判定・AI による自動採点）とのつながり。
