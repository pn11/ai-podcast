title: オースティンとアメリカの配車アプリ・ロボタクシー事情
summary: >-
  オースティンを中心に、テキサスとアメリカの配車アプリ・ロボタクシーの状況をまとめます。
  Uber・Lyft の基本と使い方、2016年に Uber・Lyft がオースティンから撤退し州法で戻ってきた経緯、
  オースティンの Waymo（Uber 経由）・Tesla Robotaxi・Zoox、2026年5月からのテキサス州の認可制度（SB 2807）、
  ダラスなど他都市と全米の様子、乗るときの心得、ロボット研究とのつながり。
  2026年11月6日時点の情報で、範囲や台数は資料によって食い違いがあり変化も速いため、利用前に各社の公式情報をご確認ください。
