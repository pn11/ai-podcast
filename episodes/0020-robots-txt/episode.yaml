title: robots.txt の話 ― クローラーとの「紳士協定」
summary: >-
  この番組のサイトに robots.txt を置けないか、という相談から、robots.txt の仕組みと歴史を解説します。
  1994年の提案と、2022年の正式な標準化（RFC 9309）、強制力がないこと、サイト直下にしか置けない落とし穴と noindex、
  ロボッツ・テキストで禁止すると noindex が読めなくなる問題、AI の学習用クローラーをめぐる最近の議論、ポッドキャストのフィードとディレクトリー。
published_at: 2026-11-13T21:30:00+09:00
