title: Physical Prompting の歴史 ― 「見せるだけ」でロボットに教える
summary: >-
  Generalist AI が GEN-1.5（2026年8月）で打ち出した「Physical Prompting」を入り口に、デモを見せるだけでロボットに教える研究の流れをたどります。
  ワンショット模倣学習（2017）、人の動画からのまね、BC-Z と VIMA のマルチモーダル・プロンプト、RT-Trajectory、XSkill、
  インコンテキスト模倣学習（Keypoint Action Tokens、Instant Policy など）、GEN-0 のスケーリング則、そして GEN-1.5 の主張と注意点。
  GEN-1.5 の数字は会社の発表にもとづくものです。
published_at: 2026-11-08T13:00:00+09:00
