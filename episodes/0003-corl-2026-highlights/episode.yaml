title: CoRL 2026 見どころガイド ― 基調講演・デモ・ワークショップ
summary: >-
  11月9日からオースティンで開かれる CoRL 2026 の見どころを紹介します。
  基調講演・若手研究者の基調講演、実機デモ（AIRoA の YUBI 体験など）、企業展示、
  これまでの回とつながるワークショップ（UMI Arena、How Real Is Real Enough?、Agentic Robotics、Physical AI Safety、Do Robots Need World Models?）を取り上げます。
  採択687本（口頭発表21本・スポットライト72本）。内容は 2026年11月6日時点の公開情報にもとづきます。日程・会場は資料によって食い違いがあるため、必ず公式プログラムで確認してください。
