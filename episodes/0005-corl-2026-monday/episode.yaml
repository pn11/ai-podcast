title: CoRL 2026 初日の注目発表 ― 口頭発表・スポットライト・ポスター
summary: >-
  CoRL 2026 初日（11月9日）のプログラムから、これまでの回とつながる発表を紹介します。
  朝のスポットライト S1、口頭発表 O1〜O3、午後のスポットライト S2、ポスターセッション 1。
  紹介は公式プログラムのタイトル・セッション・時刻にもとづき、論文の中身は未確認です。詳細は各論文と当日のプログラムでご確認ください。
