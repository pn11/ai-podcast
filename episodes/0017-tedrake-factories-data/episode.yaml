title: 工場で学ぶロボット ― テドレイクの講演と「稼ぐデータ」
summary: >-
  CoRL 2026 の Russ Tedrake の基調講演「Learning in the Factories」を、講演概要と報道から読み解きます。
  2026年1月創業の Walden Robotics、配備と学習の繰り返しという主張、「事前学習〜仕上げ用のデータは安くなり、現場のデータは稼ぐもの」という論点、
  UMI Arena で公開された大規模な手持ちデータ、事前学習モデルの価値、工場で求められる信頼性と復帰、研究者が会社を作る時代。
  講演の録画・資料は未確認で、一部の数字は二次情報です。
