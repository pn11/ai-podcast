title: NVIDIA の GR00T 2 ― ワールド・アクション・モデルは何を変えるか
summary: >-
  CoRL 2026 の Jim Fan の講演で発表された NVIDIA GR00T 2 を解説します。未来の映像と行動を一緒に予測するワールド・アクション・モデル、
  人の動画から学びやすくなる理由、発表された数字（タスクごと5デモで成功率95%、Turbo 版は搭載計算機で124ms）、
  重みの公開予定と Isaac Lab 3.0、両手のデモと「計画する大きなモデル＋動くモデル」の分業、注意して見たい点。
  数字は NVIDIA の発表によるもので、外部の検証はこれからです。
