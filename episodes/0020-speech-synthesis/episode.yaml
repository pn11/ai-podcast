title: 合成音声の歴史とライセンス ― この番組の声はどこから来たのか
summary: >-
  この番組の声（VOICEVOX）をきっかけに、合成音声の歴史と、使うときのルールを紹介します。
  機械で声をまねる装置から、ベル研究所の実演、80年代の合成音声、録音の切り貼りと統計モデル、2016年以降のニューラルな音声合成。
  日本のキャラクター音声の文化と VOICEVOX、ソフトウェアと声の「二階建て」のライセンス、この番組が自由なライセンスを台本だけにした理由、声の権利という新しい問題。
