title: 言語モデルに「時間の矢」はあるか ― 自己回帰生成モデルの熱力学
summary: >-
  東京大学・JST が2026年11月6日に発表した、沙川貴大教授（工学系研究科 物理工学専攻）の研究を解説します。
  過去の出力から次の出力を作る自己回帰生成モデル（言語モデル、RNN、カルマンフィルター、状態空間モデル、Mamba など）を確率熱力学で統一的に扱い、
  出力列の確率だけから「一方向性」を表すエントロピー生成を効率よく推定する枠組み。GPT-2 と Qwen3-4B-Base で文の並び順を逆にした実験、
  世界モデルの理解への意味、注意点（電力の話ではない、評価用の文章群は商用生成AIで作成）、ロボットのワールドモデル評価への応用の可能性（番組の感想）まで。
  論文は PRX Intelligence オンライン版に2026年11月5日（米国東部時間）掲載。東京大学のプレスリリース本文にもとづいています。
