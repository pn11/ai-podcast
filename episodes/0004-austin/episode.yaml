title: テキサスの州都オースティンってどんな街？
summary: >-
  論文から少し離れて、テキサス州の州都オースティンを紹介します。
  名前と歴史、議事堂、「ライブミュージックの世界の首都」、橋の下のコウモリ、湧き水のプール、
  テキサス・バーベキューとブレックファスト・タコス、テックと大学の街としての顔、訪れるときのヒント。
  数字や時期は資料によって幅があるため、最新情報は各公式サイトでご確認ください。
