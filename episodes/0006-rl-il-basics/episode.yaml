title: 強化学習と模倣学習の基礎 ― 方策ってなに？ DQN ってなに？
summary: >-
  これまでの回で使ってきた言葉の基礎をおさらいします。エージェントと環境、報酬、方策、価値と割引、Q学習、
  DQN（経験リプレイ・ターゲットネットワーク・ε-greedy）、方策勾配とアクター・クリティック、
  ロボットで強化学習を使う難しさ、模倣学習（ビヘイビア・クローニング、複合誤差、DAgger）、そして両者の組み合わせ。
