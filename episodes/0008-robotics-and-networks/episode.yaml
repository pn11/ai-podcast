title: ロボットと通信 ― 遅延、帯域、そして「つながらない」ときの設計
summary: >-
  ロボティクスと通信の組み合わせを、ロボットの中の配線から遠隔操作、クラウド、宇宙まで順に解説します。
  遅延・帯域・ジッター・パケットロス、制御ループと通信の持ち時間、ROS 2 と通信の品質設定、遠隔操作と力覚の遅延、
  火星探査車の監視型制御、クラウド・エッジ・手元での推論と非同期推論、Wi-Fi と 5G／ローカル5G、PTP による時刻同期、
  マルチロボットと地下での通信中継、通信断のときの安全とセキュリティ。
