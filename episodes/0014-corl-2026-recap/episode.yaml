title: CoRL 2026 振り返り ― 4日間で見えたこと
summary: >-
  オースティンで開かれた CoRL 2026 の全体の振り返りです。過去最多の投稿 2094 件・採択 687 本、
  基調講演（Burgard、Tedrake、Fei-Fei Li とリサ・スーの対談、NVIDIA の Jim Fan）、
  会期中に目立った三つのテーマ（ワールドモデル、計画と動作の分業、データは安くなったが現場のデータは稼ぐもの）、展示とデモ。
  公式アカウントの告知・企業発表・報道や参加者のまとめにもとづく内容で、講演そのものは未確認です（2026年11月13日時点）。
