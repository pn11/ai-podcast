title: マクスウェルの悪魔と情報熱力学 ― 「知ること」にエネルギーの値段はあるか
summary: >-
  第13回の背景にある情報熱力学を、マクスウェルの悪魔の150年の謎解きとして紹介します。
  熱力学の第二法則、悪魔の思考実験、シラードの1ビットのエンジン、ランダウアーの原理（消すことのコスト）、ベネットの整理、
  2010年の情報をエネルギーに換える実験（Toyabe, Sagawa ら）と2012年のランダウアーの原理の検証（Bérut ら）、
  そしてフィードバック制御としてのロボットとのつながり。
published_at: 2026-11-13T23:00:00+09:00
