title: ROS ってなに？ ― 歴史と仕組み、そして Booster K1 は ROS を使っているのか
summary: >-
  ROS（Robot Operating System）を基礎から解説します。ミドルウェアとしての役割、ノード・トピック・サービス・アクション、
  スタンフォードとウィロー・ガレージ、PR2 から始まる歴史、ROS 1 から DDS を土台にした ROS 2 への移行、Noetic のサポート終了（2025年5月）、
  最新の LTS「Lyrical Luth」（2026年5月）。後半は Booster Robotics の小型ヒューマノイド K1 が ROS を使っているのかを整理します
  （公式 SDK は Fast DDS ベースの独自 SDK で、ROS 2 とは組み合わせやすい。ROS 2 対応の程度は情報が食い違うため公式ドキュメントで確認を）。
